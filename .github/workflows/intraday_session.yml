name: Autonomous Market-Hours Day Trader (Free Forever)

# Triggered on-time ($0/mo) via External Edge Cron -> GitHub `workflow_dispatch` REST API
# (`infrastructure/cloudflare_cron/worker.js` or `cron-job.org`):
#   - Session Part 1 (Mon-Fri 09:20 ET): `inputs: { action: "session", until_et: "12:58" }`
#   - Session Part 2 (Mon-Fri 12:50 ET): `inputs: { action: "session", until_et: "16:05" }`
#
# Hardened Midday Handoff (Zero-Kill Overlap):
#   - Part 1 and Part 2 use separate concurrency groups with `cancel-in-progress: false` so
#     Part 2 NEVER kills Part 1 while Part 2 is booting, installing deps, running `pytest`, or
#     verifying Alpaca health (`python main.py status`).
#   - Once Part 2 is healthy, it waits cleanly for Part 1's 12:58 ET exit & `bot_state.db` push,
#     pulls the morning SQLite state, and takes over seamlessly for 12:59–16:05 ET.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Command to execute (session | once | status | flatten)"
        required: false
        default: "session"
      until_et:
        description: "Optional US Eastern cutoff HH:MM for session mode (auto: 12:58 before 11:30 ET, else 16:05)"
        required: false
        default: ""

concurrency:
  group: spy-daytrader-session-${{ github.event.inputs.until_et || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intraday-trading-session:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_DATA_FEED: "iex"
      STRATEGY_MODE: "alpha_max"
      ATR_PROFILE: "standard"
      TRADING_SYMBOL: "SPY"
      STATE_DB_PATH: "data/bot_state.db"
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      INPUT_ACTION: ${{ github.event.inputs.action }}
      INPUT_UNTIL_ET: ${{ github.event.inputs.until_et }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Safety & Unit Test Suite
        run: |
          pytest -q

      - name: Preflight Broker & Ledger Health Check
        run: |
          python main.py status

      - name: Wait for Part 1 Handoff & Pull Morning State (Part 2 Only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          ACTION="${INPUT_ACTION:-session}"
          if [ "$ACTION" != "session" ]; then
            exit 0
          fi
          UNTIL_ET="$INPUT_UNTIL_ET"
          if [ -z "$UNTIL_ET" ]; then
            UNTIL_ET="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; now = datetime.now(ZoneInfo("America/New_York")); print("12:58" if (now.hour, now.minute) < (11, 30) else "16:05")')"
          fi
          if [ "$UNTIL_ET" != "16:05" ]; then
            exit 0
          fi
          python - << 'EOF'
          import json, os, time, urllib.request
          from datetime import datetime, time as dt_time
          from zoneinfo import ZoneInfo

          ny = ZoneInfo("America/New_York")
          repo = os.environ["GITHUB_REPO"]
          cur_id = int(os.environ["CURRENT_RUN_ID"])
          token = os.environ["GH_TOKEN"]

          def part1_active() -> bool:
              url = f"https://api.github.com/repos/{repo}/actions/workflows/intraday_session.yml/runs?status=in_progress&per_page=10"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "spy-daytrader-handoff/1.0",
              })
              try:
                  with urllib.request.urlopen(req, timeout=10) as r:
                      runs = json.loads(r.read().decode()).get("workflow_runs") or []
                  return any(int(run["id"]) != cur_id for run in runs)
              except Exception as exc:
                  print("Handoff poll warning:", exc)
                  return False

          while datetime.now(ny).time() < dt_time(12, 58, 30):
              if not part1_active():
                  print("[HANDOFF] Part 1 completed; proceeding with Part 2.")
                  break
              print("[HANDOFF] Part 2 healthy; waiting 10s for Part 1 clean 12:58 ET exit...")
              time.sleep(10)
          EOF
          git pull --rebase origin main || true

      - name: Run Autonomous Market-Hours Bot
        run: |
          ACTION="${INPUT_ACTION:-session}"
          if [ "$ACTION" = "session" ]; then
            if [ -n "$INPUT_UNTIL_ET" ]; then
              UNTIL_ET="$INPUT_UNTIL_ET"
            else
              UNTIL_ET="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; now = datetime.now(ZoneInfo("America/New_York")); print("12:58" if (now.hour, now.minute) < (11, 30) else "16:05")')"
            fi
            echo "[SESSION] Starting autonomous SPY session until ${UNTIL_ET} ET..."
            python main.py session --until-et "$UNTIL_ET"
          elif [ "$ACTION" = "once" ]; then
            python main.py once
          elif [ "$ACTION" = "status" ]; then
            python main.py status
          elif [ "$ACTION" = "flatten" ]; then
            python main.py flatten
          else
            echo "Unknown action: $ACTION" && exit 1
          fi

      - name: Checkpoint & Sync SQLite State Ledger
        if: always()
        run: |
          python - << 'EOF'
          import sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from spy_daytrader.config import BotConfig
          from spy_daytrader.dashboard_data import fetch_dashboard_snapshot
          try:
              cfg = BotConfig.from_env()
              if cfg.alpaca_api_key.strip() and cfg.alpaca_secret_key.strip():
                  fetch_dashboard_snapshot(cfg)
          except Exception as exc:
              print("Dashboard snapshot cache warning:", exc)
          db = Path("data/bot_state.db")
          if db.exists():
              conn = sqlite3.connect(str(db))
              conn.execute("PRAGMA wal_checkpoint(TRUNCATE);")
              conn.close()
          EOF
          if [ -f data/bot_state.db ]; then
            git config user.name "spy-daytrader-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/bot_state.db
            if ! git diff --staged --quiet; then
              git commit -m "chore(state): sync autonomous intraday bot_state.db [skip ci]"
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            fi
          fi

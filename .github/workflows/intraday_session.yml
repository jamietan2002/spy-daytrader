name: Autonomous Market-Hours Day Trader (Free Forever)

# Triggered on-time ($0/mo) via External Edge Cron -> GitHub `workflow_dispatch` REST API
# (Cloudflare Workers Cron Trigger in `trader/infrastructure/cloudflare_cron/` or `cron-job.org`):
#   - Session Part 1 (Mon-Fri 09:20 ET): `inputs: { action: "session", until_et: "12:58" }`
#   - Session Part 2 (Mon-Fri 12:50 ET): `inputs: { action: "session", until_et: "16:05" }`
# Native GitHub `on: schedule` is intentionally omitted to prevent 2-8h queue delays, dropped
# morning starts, and late cron events accidentally cancelling active `workflow_dispatch` sessions.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Command to execute (session | once | status | flatten)"
        required: false
        default: "session"
      until_et:
        description: "Optional US Eastern cutoff HH:MM for session mode (auto: 12:58 before 11:30 ET, else 16:05)"
        required: false
        default: ""

# Seamless midday handoff: when Part 2 (12:50 ET) starts, Part 1 finishes cleanly and hands over with zero gap
concurrency:
  group: spy-daytrader-market-session
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  intraday-trading-session:
    runs-on: ubuntu-latest
    timeout-minutes: 315
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: "https://paper-api.alpaca.markets"
      ALPACA_DATA_FEED: "iex"
      STRATEGY_MODE: "alpha_max"
      ATR_PROFILE: "standard"
      TRADING_SYMBOL: "SPY"
      STATE_DB_PATH: "data/bot_state.db"
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      INPUT_ACTION: ${{ github.event.inputs.action }}
      INPUT_UNTIL_ET: ${{ github.event.inputs.until_et }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Safety & Unit Test Suite
        run: |
          pytest -q

      - name: Run Autonomous Market-Hours Bot
        run: |
          ACTION="${INPUT_ACTION:-session}"
          if [ "$ACTION" = "session" ]; then
            if [ -n "$INPUT_UNTIL_ET" ]; then
              UNTIL_ET="$INPUT_UNTIL_ET"
            else
              UNTIL_ET="$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; now = datetime.now(ZoneInfo("America/New_York")); print("12:58" if (now.hour, now.minute) < (11, 30) else "16:05")')"
            fi
            echo "[SESSION] Starting autonomous SPY session until ${UNTIL_ET} ET..."
            python main.py session --until-et "$UNTIL_ET"
          elif [ "$ACTION" = "once" ]; then
            python main.py once
          elif [ "$ACTION" = "status" ]; then
            python main.py status
          elif [ "$ACTION" = "flatten" ]; then
            python main.py flatten
          else
            echo "Unknown action: $ACTION" && exit 1
          fi

      - name: Checkpoint & Sync SQLite State Ledger
        if: always()
        run: |
          python - << 'EOF'
          import sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from spy_daytrader.config import BotConfig
          from spy_daytrader.dashboard_data import fetch_dashboard_snapshot
          try:
              cfg = BotConfig.from_env()
              if cfg.alpaca_api_key.strip() and cfg.alpaca_secret_key.strip():
                  fetch_dashboard_snapshot(cfg)
          except Exception as exc:
              print("Dashboard snapshot cache warning:", exc)
          db = Path("data/bot_state.db")
          if db.exists():
              conn = sqlite3.connect(str(db))
              conn.execute("PRAGMA wal_checkpoint(TRUNCATE);")
              conn.close()
          EOF
          if [ -f data/bot_state.db ]; then
            git config user.name "spy-daytrader-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/bot_state.db
            if ! git diff --staged --quiet; then
              git commit -m "chore(state): sync autonomous intraday bot_state.db [skip ci]"
              git pull --rebase origin main || true
              git push origin HEAD:main || true
            fi
          fi

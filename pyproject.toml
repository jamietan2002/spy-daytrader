[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-daytrader"
version = "1.0.0"
description = "Institutional-grade intraday SPY paper day-trading bot & 5m event-driven backtester powered by alpaca-py and pandas-ta."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30.0",
    "pandas>=2.1.0",
    "pandas-ta>=0.4.71b0; python_version >= '3.12'",
    "pandas-ta-classic>=0.9.0; python_version < '3.12'",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
spy-bot = "spy_daytrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
